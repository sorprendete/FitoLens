// Módulo nativo local Expo: descarga de APK en segundo plano.
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

group = 'expo.modules.descargaapk'

android {
    namespace 'expo.modules.descargaapk'

    // Mismas versiones de SDK que la app (las define expo/react-native en el proyecto raíz).
    compileSdk rootProject.ext.has('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 37

    defaultConfig {
        minSdk rootProject.ext.has('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdk rootProject.ext.has('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 37
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation project(':expo-modules-core')
    implementation 'androidx.core:core-ktx:1.15.0'
}
