# Sitio de nginx para FitoLens en un VPS compartido.
# Copiar a /etc/nginx/sites-available/fitolens, enlazar en sites-enabled y luego:
#   certbot --nginx -d fitolens.5-253-232-122.sslip.io
server {
    listen 80;
    listen [::]:80;
    server_name fitolens.5-253-232-122.sslip.io;

    client_max_body_size 15M;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
